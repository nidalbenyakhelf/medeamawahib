
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بحث - منصة مواهب المدية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="search.css">
</head>
<body>

    <div class="search-page-container">
        <!-- شريط البحث -->
        <div class="search-bar-wrapper">
            <a href="../index.html" class="btn-back" title="العودة للرئيسية">
                <i class="fa-solid fa-arrow-right"></i>
            </a>
            <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن موهبة بالاسم، الوصف، أو الفئة...">
            <button class="btn-search-icon">
                <i class="fa-solid fa-search"></i>
            </button>
        </div>

        <!-- شريط الفئات الملون (✅ أسماء متطابقة مع صفحة التسجيل) -->
        <div class="categories-strip">
            <button class="cat-pill active" data-filter="all">
                <i class="fa-solid fa-layer-group"></i>
                <span>الكل</span>
            </button>
            <button class="cat-pill cp-purple" data-filter="visual_arts">
                <i class="fa-solid fa-palette"></i>
                <span>الفنون البصرية</span>
            </button>
            <button class="cat-pill cp-blue" data-filter="music">
                <i class="fa-solid fa-music"></i>
                <span>الموسيقى والأداء</span>
            </button>
            <button class="cat-pill cp-green" data-filter="writing">
                <i class="fa-solid fa-pen-nib"></i>
                <span>الكتابة والإبداع</span>
            </button>
            <button class="cat-pill cp-orange" data-filter="tech">
                <i class="fa-solid fa-laptop-code"></i>
                <span>التكنولوجيا</span>
            </button>
            <button class="cat-pill cp-red" data-filter="cinema">
                <i class="fa-solid fa-video"></i>
                <span>الإنتاج السينمائي</span>
            </button>
            <button class="cat-pill cp-teal" data-filter="podcast">
                <i class="fa-solid fa-microphone-lines"></i>
                <span>البودكاست والصوتيات</span>
            </button>
        </div>

        <!-- شريط الأدوات والفلترة -->
        <div class="results-toolbar">
            <div class="results-count">
                عرض <span id="resultsCount">0</span> موهبة
            </div>
            <div class="toolbar-actions">
                <div class="custom-select">
                    <select id="municipalitySelect">
                        <option value="">كل البلديات</option>
                        <option value="medea">المدية</option>
                        <option value="berrouaghia">البرواقية</option>
                        <option value="tablat">تابلاط</option>
                        <option value="ksar_el_boukhari">قصر البخاري</option>
                        <option value="chellalat">شلالة العذاورة</option>
                        <option value="souaghi">السواقي</option>
                        <option value="aziz">عزيز</option>
                        <option value="el_omaria">العمارية</option>
                        <option value="boghar">بوغار</option>
                        <option value="other">أخرى</option>
                    </select>
                    <i class="fa-solid fa-chevron-down select-arrow"></i>
                </div>

                <div class="custom-select">
                    <select id="sortSelect">
                        <option value="newest">الأحدث أولاً</option>
                        <option value="oldest">الأقدم أولاً</option>
                        <option value="random">عشوائي</option>
                    </select>
                    <i class="fa-solid fa-chevron-down select-arrow"></i>
                </div>
            </div>
        </div>

        <!-- شبكة عرض المواهب -->
        <div id="talentsGrid" class="talents-grid">
            <!-- سيتم ملؤها بواسطة JavaScript -->
        </div>

        <!-- حالة عدم وجود نتائج -->
        <div id="noResults" class="no-results" style="display: none;">
            <i class="fa-solid fa-magnifying-glass"></i>
            <p>عذراً، لم نجد نتائج مطابقة لبحثك.</p>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="search.js"></script>
</body>
